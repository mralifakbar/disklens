name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SIGN_IDENTITY: "Developer ID Application: Alif Akbar Kartadinata (5583X832TP)"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" DISKLENS_SIGN_IDENTITY="$SIGN_IDENTITY" ./build.sh --universal

      - name: Notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$NOTARY_KEY_PATH"
          scripts/notarize.sh build/DiskLens.app

      - name: Package and checksum
        working-directory: build
        run: |
          ditto -c -k --keepParent DiskLens.app "DiskLens-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 DiskLens-*.zip | tee SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="[$version]" '/^## \[/ { p = index($0, v) > 0; next } /^\[[^]]+\]: / { p = 0 } p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo "Unzip, move **DiskLens.app** to Applications and open it. The app is signed with a Developer ID and notarized by Apple, so macOS opens it without a warning."
            echo
            echo "SHA-256:"
            echo '```'
            cat build/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DiskLens-*.zip build/SHA256SUMS.txt \
            --title "DiskLens ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
