name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build universal app
        run: ./build.sh --universal --zip

      - name: Smoke test
        run: |
          build/DiskLens.app/Contents/MacOS/DiskLens --version
          codesign --verify --strict build/DiskLens.app

      - uses: actions/upload-artifact@v4
        with:
          name: DiskLens-app
          path: build/DiskLens-*.zip
          retention-days: 7
